name: make-all

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

jobs:
  linux-isolation-proof:
    name: linux-isolation-proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install pinned Codex under the trusted host root
        run: |
          sudo npm install --prefix /usr/local/lib/symphony-codex-0.159.3 --no-save --no-package-lock --no-audit --no-fund '@openai/codex-linux-x64@npm:@openai/codex@0.159.3-linux-x64'
          sudo chown -R root:root /usr/local/lib/symphony-codex-0.159.3
          sudo chmod -R go-w,a-s /usr/local/lib/symphony-codex-0.159.3
          echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path" >> "$GITHUB_PATH"

      - name: Enable and verify unprivileged Linux namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-current-user --pid --fork --mount-proc \
            /usr/bin/python3 -I -S -c 'import os; assert os.getpid() == 1'

      - name: Verify Codex version
        run: |
          export PATH="/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin:/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path:$PATH"
          codex_path="$(command -v codex)"
          echo "Pinned Codex path: $codex_path"
          stat -Lc 'Codex file: uid=%u mode=%a type=%F path=%n' "$codex_path"
          namei -l "$codex_path"
          test "$(stat -c '%u' "$codex_path")" = "0"
          test "$(codex --version)" = "codex-cli 0.159.3"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: make -C elixir setup

      - name: Run Linux isolation proof
        env:
          SYMPHONY_ENFORCE_TEST_RUNTIME_PATH_TRUST: "1"
        run: |
          export PATH="/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin:/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path:$PATH"
          codex_path="$(command -v codex)"
          echo "Isolation proof Codex path: $codex_path"
          stat -Lc 'Codex file: uid=%u mode=%a type=%F path=%n' "$codex_path"
          namei -l "$codex_path"
          make -C elixir isolation-proof

  linux-full-gate:
    name: linux-full-gate
    needs:
      - linux-isolation-proof
    if: ${{ needs.linux-isolation-proof.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install pinned Codex under the trusted host root
        run: |
          sudo npm install --prefix /usr/local/lib/symphony-codex-0.159.3 --no-save --no-package-lock --no-audit --no-fund '@openai/codex-linux-x64@npm:@openai/codex@0.159.3-linux-x64'
          sudo chown -R root:root /usr/local/lib/symphony-codex-0.159.3
          sudo chmod -R go-w,a-s /usr/local/lib/symphony-codex-0.159.3
          echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path" >> "$GITHUB_PATH"

      - name: Enable and verify unprivileged Linux namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-current-user --pid --fork --mount-proc \
            /usr/bin/python3 -I -S -c 'import os; assert os.getpid() == 1'

      - name: Verify Codex version
        run: |
          export PATH="/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin:/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path:$PATH"
          codex_path="$(command -v codex)"
          echo "Pinned Codex path: $codex_path"
          stat -Lc 'Codex file: uid=%u mode=%a type=%F path=%n' "$codex_path"
          namei -l "$codex_path"
          test "$(stat -c '%u' "$codex_path")" = "0"
          test "$(codex --version)" = "codex-cli 0.159.3"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Run Linux quality gate (make ci)
        env:
          SYMPHONY_ENFORCE_TEST_RUNTIME_PATH_TRUST: "1"
        timeout-minutes: 15
        run: |
          export PATH="/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin:/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path:$PATH"
          codex_path="$(command -v codex)"
          echo "Full gate Codex path: $codex_path"
          stat -Lc 'Codex file: uid=%u mode=%a type=%F path=%n' "$codex_path"
          namei -l "$codex_path"
          make -C elixir ci

      - name: Run Linux full-gate Codex regressions (make isolation-proof)
        env:
          SYMPHONY_ENFORCE_TEST_RUNTIME_PATH_TRUST: "1"
        timeout-minutes: 15
        run: make -C elixir isolation-proof

  make-all:
    name: make-all
    if: ${{ always() }}
    needs:
      - linux-isolation-proof
      - linux-full-gate
    runs-on: ubuntu-latest

    steps:
      - name: Require Linux isolation proof
        run: |
          test "${{ needs.linux-isolation-proof.result }}" = success

      - name: Require Linux full gate
        run: |
          test "${{ needs.linux-full-gate.result }}" = success
