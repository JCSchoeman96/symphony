name: make-all

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

jobs:
  linux-isolation-proof:
    name: linux-isolation-proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install pinned Codex under the trusted host root
        run: |
          sudo npm install --prefix /opt/symphony-codex-0.159.3 --no-save --no-package-lock --no-audit --no-fund '@openai/codex-linux-x64@npm:@openai/codex@0.159.3-linux-x64'
          echo "/opt/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          echo "/opt/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path" >> "$GITHUB_PATH"

      - name: Verify Codex version
        run: |
          codex_path="$(command -v codex)"
          test "$(stat -c '%u' "$codex_path")" = "0"
          test "$(codex --version)" = "codex-cli 0.159.3"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Elixir dependencies
        run: make -C elixir setup

      - name: Run Linux isolation proof
        env:
          SYMPHONY_ENFORCE_TEST_RUNTIME_PATH_TRUST: "1"
        run: make -C elixir isolation-proof

  linux-full-gate:
    name: linux-full-gate
    needs:
      - linux-isolation-proof
    if: ${{ needs.linux-isolation-proof.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up mise tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: true
          cache: true
          working_directory: elixir

      - name: Install pinned Codex under the trusted host root
        run: |
          sudo npm install --prefix /opt/symphony-codex-0.159.3 --no-save --no-package-lock --no-audit --no-fund '@openai/codex-linux-x64@npm:@openai/codex@0.159.3-linux-x64'
          echo "/opt/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
          echo "/opt/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path" >> "$GITHUB_PATH"

      - name: Verify Codex version
        run: |
          codex_path="$(command -v codex)"
          test "$(stat -c '%u' "$codex_path")" = "0"
          test "$(codex --version)" = "codex-cli 0.159.3"

      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Verify make all
        env:
          SYMPHONY_ENFORCE_TEST_RUNTIME_PATH_TRUST: "1"
        run: make -C elixir all

  make-all:
    name: make-all
    if: ${{ always() }}
    needs:
      - linux-isolation-proof
      - linux-full-gate
    runs-on: ubuntu-latest

    steps:
      - name: Require Linux isolation proof
        run: |
          test "${{ needs.linux-isolation-proof.result }}" = success

      - name: Require Linux full gate
        run: |
          test "${{ needs.linux-full-gate.result }}" = success
