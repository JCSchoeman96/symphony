name: Set up Linux Elixir
description: Install the repository-pinned Elixir environment and dependencies

inputs:
  codex:
    description: Install the pinned Codex executable under the trusted host root
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up mise tools
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      with:
        install: true
        cache: true
        working_directory: elixir

    - name: Cache deps and build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          elixir/deps
          elixir/_build
        key: ${{ runner.os }}-mix-${{ hashFiles('elixir/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-

    - name: Install Elixir dependencies
      shell: bash
      run: make -C elixir setup

    - name: Install pinned Codex under the trusted host root
      if: ${{ inputs.codex == 'true' }}
      shell: bash
      run: |
        sudo npm install --prefix /usr/local/lib/symphony-codex-0.159.3 --no-save --no-package-lock --no-audit --no-fund '@openai/codex-linux-x64@npm:@openai/codex@0.159.3-linux-x64'
        sudo chown -R root:root /usr/local/lib/symphony-codex-0.159.3
        sudo chmod -R go-w,a-s /usr/local/lib/symphony-codex-0.159.3
        echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin" >> "$GITHUB_PATH"
        echo "/usr/local/lib/symphony-codex-0.159.3/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex-path" >> "$GITHUB_PATH"

    - name: Enable and verify unprivileged Linux namespaces
      if: ${{ inputs.codex == 'true' }}
      shell: bash
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare --user --map-current-user --pid --fork --mount-proc \
          /usr/bin/python3 -I -S -c 'import os; assert os.getpid() == 1'
